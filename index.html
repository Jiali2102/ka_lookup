  <style>
    :root {
      --orange: #FE5F00;
      --orange-dark: #E0500A;
      --blue: #0E4174;
      --blue-soft: #EAF1F8;
      --bg: #F6F5F2;
      --surface: #FFFFFF;
      --border: #E7E4DE;
      --text: #1A1A1A;
      --muted: #6B7280;
      --ok: #16A34A;
      --ok-bg: #EAF7EE;
      --warn: #D97706;
      --warn-bg: #FDF3E3;
      --danger: #DC2626;
      --danger-bg: #FCEAEA;
      --pending: #6B7280;
      --pending-bg: #EEF0F2;
      --radius: 14px;
      --mono: 'Cambria', 'Times New Roman', serif;
      --sans: 'Cambria', Georgia, 'Times New Roman', serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--sans);
      font-size: 23px;

      background:
        radial-gradient(1200px 400px at 100% -10%, rgba(254, 95, 0, 0.06), transparent 60%),
        var(--bg);
      color: var(--text);
    }

    .app-shell {
      display: flex;
      height: 100vh;
    }

    .rail {
      width: 96px;
      flex: none;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 0;
      gap: 8px;
      overflow-y: auto;
    }

    .rail,
    .side-panel,
    .results-table-wrap,
    #notfound-area {
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .rail::-webkit-scrollbar,
    .side-panel::-webkit-scrollbar,
    .results-table-wrap::-webkit-scrollbar,
    #notfound-area::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .rail::-webkit-scrollbar-track,
    .side-panel::-webkit-scrollbar-track,
    .results-table-wrap::-webkit-scrollbar-track,
    #notfound-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .rail::-webkit-scrollbar-thumb,
    .side-panel::-webkit-scrollbar-thumb,
    .results-table-wrap::-webkit-scrollbar-thumb,
    #notfound-area::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 8px;
    }

    .rail-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
      margin-bottom: 10px;
    }

    .rail-logout {
      margin-top: auto;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--muted);
      font-size: 17px;
      cursor: pointer;
      transition: all .15s;
      flex-shrink: 0;
    }

    .rail-logout:hover {
      color: var(--danger);
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    .side-panel {
      width: 320px;
      flex: none;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 18px;
      overflow-y: auto;
    }

    .app-title {
      font-weight: 800;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 14px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .main-col {
      flex: 1;
      min-width: 0;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #results-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #chk-results-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .result-table th,
    .result-table td {
      white-space: nowrap;
    }

    .result-table tbody tr {
      background: var(--surface);
    }

    .tab,
    button,
    .file-upload-btn,
    .chk-edit-link {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="7" fill="%23FE5F00" opacity="0.85"/></svg>') 11 11, pointer;
      transition: transform .12s ease;
    }

    .tab:hover,
    .btn-ghost:hover,
    .btn-primary:hover,
    .file-upload-btn:hover {
      transform: translateY(-1px);
    }

    .nf-toggle {
      position: fixed;
      right: 22px;
      bottom: 22px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 100px;
      padding: 13px 20px;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(192, 57, 43, .3);
      z-index: 60;
    }

    .nf-toggle:hover {
      opacity: .9;
    }

    .nf-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      right: -380px;
      width: 360px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 24px rgba(0, 0, 0, .08);
      display: flex;
      flex-direction: column;
      transition: right .25s ease;
      z-index: 70;
    }

    .nf-drawer.open {
      right: 0;
    }

    .nf-drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 15px;
    }

    .nf-close {
      background: transparent;
      border: none;
      font-size: 18px;
      color: var(--muted);
      cursor: pointer;
    }

    #notfound-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
    }

    @media (max-width:1000px) {

      html,
      body {
        overflow: auto;
      }

      .app-shell {
        flex-direction: column;
        height: auto;
      }

      .rail {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
      }

      .rail-logout {
        margin-top: 0;
        margin-left: auto;
      }

      .side-panel,
      .main-col {
        width: 100%;
      }

      .nf-drawer {
        width: 100%;
        right: -100%;
      }
    }

    .rail-logout,
    .logout-btn {
      white-space: nowrap;
    }

    .brand .mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 15px;
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    .tab {
      width: 74px;
      text-align: center;
      padding: 10px 4px;
      border-radius: 13px;
      font-weight: 600;
      font-size: 12.5px;
      line-height: 1.3;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: all .15s ease;
      border: 1px solid transparent;
    }

    .tab.active {
      background: var(--orange);
      color: white;
      box-shadow: 0 2px 8px rgba(254, 95, 0, 0.28);
    }

    .tab:not(.active):hover {
      background: #F2F1ED;
      color: var(--text);
    }

    .tab .cnt {
      display: block;
      font-size: 11px;
      font-weight: 500;
      opacity: .85;
      margin-top: 1px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 0;
    }

    .panel h2 {
      margin: 0 0 3px;
      font-size: 17px;
      font-weight: 700;
    }

    .panel p.hint {
      margin: 0 0 8px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.4;
    }

    label.field-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1.5;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #FBFAF8;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }

    textarea:focus {
      border-color: var(--orange);
      background: white;
    }

    .chk-input {
      width: 100%;
      font-family: var(--sans);
      font-size: 15px;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #FBFAF8;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
      margin-top: 4px;
    }

    .chk-input:focus {
      border-color: var(--orange);
      background: white;
    }

    .chk-config-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--ok-bg, #E9F7EF);
      border: 1px solid #C9E9D4;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13.5px;
      color: var(--ok, #1E8E5A);
    }

    .chk-edit-link {
      background: none;
      border: none;
      color: var(--blue);
      font-weight: 700;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }

    @keyframes tabFlash {
      0% { box-shadow: 0 0 0 0 rgba(254, 95, 0, .55); }
      70% { box-shadow: 0 0 0 10px rgba(254, 95, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(254, 95, 0, 0); }
    }

    .tab.flash {
      animation: tabFlash .6s ease-out;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .row .col {
      flex: 1;
      min-width: 150px;
    }

    input[type=date] {
      width: 100%;
      font-family: var(--sans);
      font-size: 16px;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #FBFAF8;
      color: var(--text);
      outline: none;
    }

    input[type=date]:focus {
      border-color: var(--orange);
      background: white;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      cursor: pointer;
      transition: transform .1s, opacity .15s;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--orange);
      color: white;
    }

    .btn-primary:hover {
      background: var(--orange-dark);
    }

    .btn-primary:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: #c9c5bd;
    }

    .btn-ghost:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .count-tag {
      margin-left: auto;
      font-size: 15px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .divider-or {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      color: var(--muted);
      font-size: 12.5px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .divider-or::before,
    .divider-or::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .file-upload-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .file-upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
      background: var(--blue-soft);
      color: var(--blue);
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      border: 1.5px dashed var(--blue);
      transition: background .15s;
    }

    .file-upload-btn:hover {
      background: #dfeafb;
    }

    .file-upload-hint {
      font-size: 12.5px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      flex: none;
    }

    .result-search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .result-search-input {
      flex: 1;
      min-width: 220px;
      font-family: var(--sans);
      font-size: 16px;
      padding: 9px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }

    .result-search-input:focus {
      border-color: var(--orange);
    }

    .result-search-count {
      font-size: 15px;
      color: var(--muted);
      font-family: var(--mono);
      white-space: nowrap;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-badge {
      font-size: 15px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 100px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .stat-badge.total {
      color: var(--blue);
      border-color: #cfe0f0;
      background: var(--blue-soft);
    }

    .stat-badge.found {
      color: var(--ok);
      border-color: #bfe6cc;
      background: var(--ok-bg);
    }

    .stat-badge.notfound {
      color: var(--danger);
      border-color: #f3c9c9;
      background: var(--danger-bg);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pagesize-label {
      font-size: 15.5px;

</head>

<body>

  <!-- ============ GATE: BƯỚC 1 - GOOGLE SSO ============ -->

    <div id="google-step" class="auth-card">
      <div class="auth-mark">KA</div>

  <script>function initApp() {
      const CONFIG = {
        WEBHOOK_URL: WEBHOOK_BASE_URL,
        TABS: {
          denbu: {
            label: "Đền bù",
            useDateRange: false,
            knownFields: ["so_tien", "loai_yeu_cau", "ngay_duyet"],
            amountFields: ["so_tien"],
            dateFields: ["ngay_duyet"],
            statusField: null
          },
          quahan: {
            label: "Quá hạn",
            useDateRange: false,
            knownFields: ["reason", "overdue_date"],
            amountFields: [],
            dateFields: ["overdue_date"],
            statusField: null
          },
          miencuoc: {
            label: "Miễn cước",
            useDateRange: false,
            knownFields: ["ly_do", "so_tien_mien", "ngay_duyet", "trang_thai"],
            amountFields: ["so_tien_mien"],
            dateFields: ["ngay_duyet"],
            statusField: "trang_thai",
            notReady: true
          },
          ticket: {
            label: "Ticket",
            useDateRange: false,
            knownFields: ["client_name", "reason_type", "first_article_from"],
            amountFields: [],
            dateFields: [],
            statusField: null,
            linkedFieldMap: {
              reason_type: "ticket_url"
            },
            exportExtraFields: ["ticket_url"]
          },
          fake_attempt: {
            label: "Fake Attempt",
            useDateRange: false,
            knownFields: ["month", "client_type"],
            amountFields: [],
            dateFields: ["month"],
            statusField: null
          }
        },
        FIELD_LABELS: {
          ma_don: "Mã đơn",
          order_code: "Mã đơn",
          so_tien: "Giá trị đền bù",
          loai_yeu_cau: "Loại yêu cầu",
          ngay_duyet: "Ngày duyệt",
          reason: "Lý do",
          overdue_date: "Ngày chốt quá hạn",
          ly_do: "Lý do",
          so_tien_mien: "Số tiền miễn",
          trang_thai: "Trạng thái",
          client_name: "Client / Team",
          reason_type: "Lý do",
          ticket_url: "Link ticket",
          first_article_from: "Người tạo",
          month: "Tháng phát sinh",
          client_type: "Loại client"
        }
      };
      let activeTab = "denbu";
      let lastResults = [];
      let lastFullItems = [];
      let lastRequestedCodes = [];
      let searchQuery = "";
      let currentPage = 1;
      let pageSize = 20;
      const el = sel => document.querySelector(sel);
      const tabsEl = el("#tabs");
      const codesInput = el("#codes-input");
      const dateRow = el("#date-row");
      const dateFrom = el("#date-from");
      const dateTo = el("#date-to");
      const resultsArea = el("#results-area");
      const codeCount = el("#code-count");
      const fileInput = el("#file-input");
      const fileUploadStatus = el("#file-upload-status");
      function parseCodes(raw) {
        return [...new Set(raw.split(/[\s,;]+/).map(s => s.trim()).filter(Boolean))];
      }
      function flashTab(el) {
        el.classList.remove("flash");
        void el.offsetWidth;
        el.classList.add("flash");
      }
      function renderTabs() {
        tabsEl.innerHTML = "";
        Object.entries(CONFIG.TABS).forEach(([key, cfg]) => {
          const d = document.createElement("div");
          d.className = "tab" + (key === activeTab ? " active" : "");
          d.innerHTML = cfg.label;
          d.onclick = () => switchTab(key);
          tabsEl.appendChild(d);
        });
      }
      const tabState = {};
      function saveCurrentTabState() {
        tabState[activeTab] = {
          lastFullItems,
          lastRequestedCodes,
          searchQuery,
          currentPage,
          pageSize,
          codesInputValue: codesInput.value
        };
      }
      function switchTab(key) {
        saveCurrentTabState();
        activeTab = key;
        const cfg = CONFIG.TABS[key];
        renderTabs();
        const activeTabEl = el(".tabs .tab.active");
        if (activeTabEl) flashTab(activeTabEl);
        el("#panel-hint").textContent = cfg.hint;
        dateRow.style.display = cfg.useDateRange ? "flex" : "none";
        const saved = tabState[key];
        if (saved) {
          lastFullItems = saved.lastFullItems;
          lastRequestedCodes = saved.lastRequestedCodes;
          searchQuery = saved.searchQuery;
          currentPage = saved.currentPage;
          pageSize = saved.pageSize;
          codesInput.value = saved.codesInputValue;
          updateCount();
          if (lastFullItems.length || lastRequestedCodes.length) {
            rerenderTable();
          } else {
            resultsArea.innerHTML = "";
            el("#notfound-area").innerHTML = "";
          }
        } else {
          codesInput.value = "";
          resultsArea.innerHTML = "";
          el("#notfound-area").innerHTML = "";
          currentPage = 1;
          updateCount();
        }
      }
      function updateCount() {
        const n = parseCodes(codesInput.value).length;
        codeCount.textContent = n > 0 ? n + " mã đơn" : "";
      }
      codesInput.addEventListener("input", updateCount);
      function statusClass(value) {
        if (!value) return "";
        const v = value.toString().toLowerCase();
        if (/(hoàn thành|đã duyệt|đã đền|thành công|ok|approved)/.test(v)) return "ok";
        if (/(đang xử lý|chờ|pending|xem xét)/.test(v)) return "warn";
        if (/(từ chối|hủy|reject|không đạt)/.test(v)) return "danger";
        return "";
      }
      function formatAmount(v) {
        const n = Number(String(v).replace(/[^\d.-]/g, ""));
        if (isNaN(n)) return v;
        return n.toLocaleString("vi-VN") + " đ";
      }
      function getCode(item) {
        return item.ma_don || item.order_code || item.code || "";
      }
      function numberToEmoji(n) {
        if (n === 10) return "🔟";
        return String(n).split("").map(d => d + "️⃣").join("");
      }
      function annotateAndSortItems(items) {
        const sorted = [...items].sort((a, b) => getCode(a).localeCompare(getCode(b), "vi", {
          numeric: true,
          sensitivity: "base"
        }));
        const totalCounts = {};
        sorted.forEach(it => {
          const c = getCode(it).toString().toUpperCase();
          totalCounts[c] = (totalCounts[c] || 0) + 1;
        });
        const runningIdx = {};
        return sorted.map(it => {
          const c = getCode(it).toString().toUpperCase();
          runningIdx[c] = (runningIdx[c] || 0) + 1;
          return {
            ...it,
            _occIndex: runningIdx[c],
            _occTotal: totalCounts[c]
          };
        });
      }
      function normalizeKey(str) {

              for (let i = 0; i < maxCount; i++) {

      function showNormalView() {
        sidePanelNormal.style.display = "block";
        mainColNormal.style.display = "flex";
        sidePanelChecker.style.display = "none";
        mainColChecker.style.display = "none";
        tabChecker.classList.remove("active");
      }

      tabChecker.onclick = () => {
        flashTab(tabChecker);
        showCheckerView();
      };

      const originalSwitchTab = switchTab;
      switchTab = function (key) {
        showNormalView();
        originalSwitchTab(key);
      };

      function parseChkCodes(raw) {
        return [...new Set(raw.split(/[\s,;]+/).map(s => s.trim().toUpperCase()).filter(Boolean))];
      }

      chkCodesInput.addEventListener("input", () => {
        const n = parseChkCodes(chkCodesInput.value).length;
        chkCodeCount.textContent = n > 0 ? n + " mã đơn" : "";
      });

      el("#chk-btn-clear").onclick = () => {
        chkCodesInput.value = "";
        chkCodeCount.textContent = "";
        chkResultsArea.innerHTML = "";
        chkResults = [];
        chkSearchQuery = "";
      };

      let chkResults = [];
      let chkSearchQuery = "";

      function formatMoney(v) {
        const n = Number(v);
        if (isNaN(n)) return v;
        return n.toLocaleString("vi-VN") + " đ";
      }

      const CHK_COLUMNS = [
        ["order_code", "Mã đơn"],
        ["client_id", "Mã kh"],
        ["created_date", "Ngày tạo"],
        ["end_picktime", "Lấy thành công"],
        ["status", "Trạng thái"],
        ["status_ops_name", "TT vận hành"],
        ["last_action_at_vn", "TG Cập nhật cuối"],
        ["order_value", "Giá trị"],
        ["cod_amount", "COD"],
        ["insurance_value", "Khai giá"],
        ["compensation", "TG đền bù"],
        ["pickwh", "Kho lấy"],
        ["deliverywh", "Kho giao"],
        ["returnwh", "Kho trả"],
        ["currentwh", "Kho hiện tại"]
      ];
      const CHK_EXPORT_EXTRA_COLUMNS = [
        ["package_value", "Package Value"],
        ["status_name", "Trạng thái"],
        ["content", "Nội dung"],
        ["from_name", "Người gửi"],
        ["from_address", "Địa chỉ gửi"]
      ];
      const CHK_MONEY_FIELDS = new Set(["order_value", "cod_amount", "insurance_value", "package_value", "compensation"]);
      const CHK_DATE_FIELDS = new Set(["created_date", "end_picktime", "last_action_at_vn"]);

      function chkStatusRowClass(status) {
        const s = String(status || "").toLowerCase();
        if (s.includes("cancel")) return "chk-status-cancel";
        if (s.includes("lost") || s.includes("damage")) return "chk-status-lost";
        if (s.includes("returned") || s.includes("scrap")) return "chk-status-return";
        if (s.includes("delivered")) return "chk-status-delivered";
        return "";
      }

      function chkCellValue(r, field) {
        if (r.message && field === "status_name") return "Lỗi: " + r.message;
        const v = r[field];
        if (v === undefined || v === null || v === "") return "";
        if (CHK_DATE_FIELDS.has(field)) return String(v).slice(0, 10);
        return CHK_MONEY_FIELDS.has(field) ? formatMoney(v) : v;
      }

      function chkRawValue(r, field) {
        if (r.message && field === "status_name") return "Lỗi: " + r.message;
        return r[field] ?? "";
      }

      function renderChkResults() {
        if (!chkResults.length) {
          chkResultsArea.innerHTML = `<div class="empty"><div class="big">🔍</div>Chưa có kết quả.</div>`;
          return;
        }
        const filterTokens = chkSearchQuery.split(/[\s,;]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
        const filtered = filterTokens.length
          ? chkResults.filter(r => filterTokens.some(t => (r.order_code || "").toUpperCase().includes(t)))
          : chkResults;
        const searchBoxHtml = `
          <div class="result-search-row">
            <input type="text" id="chk-result-search" class="result-search-input" placeholder="Lọc mã đơn trong kết quả này — dán được nhiều mã, cách nhau bằng dấu phẩy/khoảng trắng" value="${chkSearchQuery.replace(/"/g, "&quot;")}" />
            ${chkSearchQuery ? `<button class="btn-ghost" id="chk-btn-clear-search">Xóa lọc</button>` : ""}
            <span class="result-search-count">${filterTokens.length ? `${filtered.length}/${chkResults.length} dòng khớp` : `${chkResults.length} dòng`}</span>
          </div>`;
        if (!filtered.length) {
          chkResultsArea.innerHTML = `${searchBoxHtml}<div class="empty"><div class="big">🔍</div>Không có mã đơn nào khớp ô lọc.</div>`;
          bindChkSearchEvents();
          return;
        }
        const rows = filtered.map(r => {
          const rowClass = chkStatusRowClass(r.status);
          const cells = CHK_COLUMNS.map(([field]) => {
            const cls = CHK_MONEY_FIELDS.has(field) ? ' class="amount-cell"' : (field === "order_code" ? ' class="code-cell"' : "");
            return `<td${cls}>${chkCellValue(r, field)}</td>`;
          }).join("");
          return `<tr class="${rowClass}">${cells}</tr>`;
        }).join("");
        chkResultsArea.innerHTML = `
          <div class="toolbar">
            <span class="stats"><span class="stat-badge total">Tổng: ${chkResults.length}</span></span>
            <div class="toolbar-actions">
              <button class="btn-ghost" id="chk-btn-copy">Copy kết quả</button>
              <button class="btn-ghost" id="chk-btn-csv">Xuất CSV</button>
              <button class="btn-ghost" id="chk-btn-xlsx">Xuất Excel</button>
            </div>
          </div>
          ${searchBoxHtml}<div class="results-table-wrap">
            <table class="result-table">
              <thead>
                <tr>${CHK_COLUMNS.map(([field, label]) => `<th${CHK_MONEY_FIELDS.has(field) ? ' class="align-right"' : ""}>${label}</th>`).join("")}</tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
        const exportCols = [...CHK_COLUMNS, ...CHK_EXPORT_EXTRA_COLUMNS];
        el("#chk-btn-copy").onclick = () => {
          const sanitizeForCopy = v => String(v ?? "").replace(/\r\n|\r|\n/g, " ");
          const header = exportCols.map(([, label]) => label).join("\t");
          const lines = filtered.map(r => exportCols.map(([field]) => sanitizeForCopy(chkRawValue(r, field))).join("\t"));
          navigator.clipboard.writeText([header, ...lines].join("\n"));
        };
        el("#chk-btn-csv").onclick = () => {
          const aoa = [exportCols.map(([, label]) => label)];
          filtered.forEach(r => aoa.push(exportCols.map(([field]) => chkRawValue(r, field))));
          const ws = XLSX.utils.aoa_to_sheet(aoa);
          const csv = XLSX.utils.sheet_to_csv(ws);
          const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
          const epoch = (Date.now() / 1000).toFixed(3);
          downloadBlob(blob, `output_kiemtra_${epoch}.csv`);
        };
        el("#chk-btn-xlsx").onclick = () => {
          const aoa = [exportCols.map(([, label]) => label)];
          filtered.forEach(r => aoa.push(exportCols.map(([field]) => chkRawValue(r, field))));
          const ws = XLSX.utils.aoa_to_sheet(aoa);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "KetQua");
          const epoch = (Date.now() / 1000).toFixed(3);
          XLSX.writeFile(wb, `output_kiemtra_${epoch}.xlsx`);
        };
        bindChkSearchEvents();
      }

      function bindChkSearchEvents() {
        const input = el("#chk-result-search");
        if (input) {
          input.oninput = e => {
            chkSearchQuery = e.target.value;
            const cursorPos = e.target.selectionStart;
            renderChkResults();
            const newInput = el("#chk-result-search");
            if (newInput) {
              newInput.focus();
              newInput.setSelectionRange(cursorPos, cursorPos);
            }
          };
        }
        const clearBtn = el("#chk-btn-clear-search");
        if (clearBtn) {
          clearBtn.onclick = () => {
            chkSearchQuery = "";
            renderChkResults();
            const newInput = el("#chk-result-search");
            if (newInput) newInput.focus();
          };
        }
      }

      async function fetchOneOrder(orderCode, userAgent, token) {
        const res = await fetch("/api/chk9", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order_code: orderCode, user_agent: userAgent, token })
        });
        return res.json();
      }

      chkBtnRun.onclick = async () => {
        const userAgent = chkUserAgentInput.value.trim();
        const token = chkTokenInput.value.trim();
        if (!userAgent || !token) {
          alert("Vui lòng nhập đầy đủ User-Agent và Token.");
          return;
        }
        const codes = parseChkCodes(chkCodesInput.value);
        if (!codes.length) {
          alert("Vui lòng nhập ít nhất 1 mã đơn.");
          return;
        }
        saveChkConfig();
        updateChkConfigView();
        chkBtnRun.disabled = true;
        chkResults = [];
        chkSearchQuery = "";
        for (let i = 0; i < codes.length; i++) {
          chkResultsArea.innerHTML = `<div class="state loading"><span class="spinner"></span>Đang chạy... ${i + 1}/${codes.length}</div>`;
          try {
            const data = await fetchOneOrder(codes[i], userAgent, token);
            chkResults.push({ order_code: codes[i], ...data });
          } catch (err) {
            chkResults.push({ order_code: codes[i], ok: false, message: "Lỗi kết nối" });
          }
        }
        chkBtnRun.disabled = false;
        renderChkResults();
      };

      codesInput.addEventListener("keydown", e => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) doSearch();
      });
      (function initFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const type = params.get("type");
        const codes = params.get("codes");
        if (type && CONFIG.TABS[type]) {
          activeTab = type;
          switchTab(activeTab);
          if (codes) {
            codesInput.value = codes.split(",").join("\n");
            updateCount();
            doSearch();
          }
        } else {
          renderTabs();
          showCheckerView();
        }
      })();
    }
  </script>

  <script>const WEBHOOK_BASE_URL = "/api/q9f2";
  </script>

  <script>const AUTH_STORAGE_KEY = "ka_lookup_authed_v1";
    const AUTH_PASSWORD_KEY = "ka_lookup_pw_v1";
    const AUTH_EMAIL_KEY = "ka_lookup_email_v1";
    let sessionPassword = "";

    const TYPE_WIRE_MAP = {
      denbu: "v2",
      quahan: "v3",
      ticket: "v4",
      fake_attempt: "v5",
      miencuoc: "v6"
    };
    let sessionEmail = "";

    const authGate = document.getElementById("auth-gate");
    const appRoot = document.getElementById("app-root");

    const googleStep = document.getElementById("google-step");
    const googleError = document.getElementById("google-error");
    const googleEmailDisplay = document.getElementById("google-email-display");

    const authForm = document.getElementById("auth-form");
    const authPasswordInput = document.getElementById("auth-password");
    const authError = document.getElementById("auth-error");
    const authSubmitBtn = authForm.querySelector(".auth-submit");
    const btnSwitchGoogle = document.getElementById("btn-switch-google");

    function unlockApp() {
      authGate.style.display = "none";
      appRoot.style.display = "block";
      initApp();
    }

    function showPasswordStep(email) {
      sessionEmail = email;
      googleStep.style.display = "none";
      authForm.style.display = "block";
      googleEmailDisplay.textContent = email;
      authPasswordInput.focus();
    }

    function showGoogleStep() {
      authForm.style.display = "none";
      googleStep.style.display = "block";
      googleError.textContent = "";
    }

    async function triggerAutoGenPass(email) {
      try {
        const params = new URLSearchParams({ t: "v7", e: email });
        await fetch(`${WEBHOOK_BASE_URL}?${params.toString()}`);
      } catch (err) {
      }
    }

    async function handleGoogleCredential(response) {
      googleError.textContent = "Đang xác minh với Google...";
      try {
        const params = new URLSearchParams({ i: response.credential });
        const res = await fetch(`/api/m3k7?${params.toString()}`);
        const data = await res.json();
        if (data.ok) {
          triggerAutoGenPass(data.email);
          showPasswordStep(data.email);
        } else {
          googleError.textContent = data.message || "Xác minh Google thất bại.";
        }
      } catch (err) {
        googleError.textContent = "Không xác minh được với Google, thử lại.";
      }
    }
    window.handleGoogleCredential = handleGoogleCredential;

    btnSwitchGoogle.addEventListener("click", () => {
      sessionEmail = "";
      showGoogleStep();
    });

    async function verifyPassword(email, password) {
      const params = new URLSearchParams({
        t: "v1",
        e: email,
        k: password
      });
      const res = await fetch(`${WEBHOOK_BASE_URL}?${params.toString()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data.ok === true;
    }

    authForm.addEventListener("submit", async e => {
      e.preventDefault();
      const password = authPasswordInput.value;
      if (!sessionEmail || !password) {
        authError.textContent = "Thiếu thông tin, vui lòng đăng nhập lại.";
        return;
      }
      authSubmitBtn.disabled = true;
      authError.textContent = "";
      try {
        const ok = await verifyPassword(sessionEmail, password);
        if (ok) {
          sessionPassword = password;
          try {
            localStorage.setItem(AUTH_STORAGE_KEY, "1");
            localStorage.setItem(AUTH_PASSWORD_KEY, sessionPassword);
            localStorage.setItem(AUTH_EMAIL_KEY, sessionEmail);
          } catch (err) { }
          unlockApp();
        } else {
          authError.textContent = "Sai mật khẩu, hoặc mật khẩu này không cấp cho email của bạn, hoặc đã dùng rồi (1 lần duy nhất).";
          authPasswordInput.value = "";
          authPasswordInput.focus();
        }
      } catch (err) {
        authError.textContent = "Không kiểm tra được mật khẩu, thử lại.";
      } finally {
        authSubmitBtn.disabled = false;
      }
    });

    function doLogout() {
      try {
        localStorage.removeItem(AUTH_STORAGE_KEY);
        localStorage.removeItem(AUTH_PASSWORD_KEY);
        localStorage.removeItem(AUTH_EMAIL_KEY);
      } catch (err) { }
      sessionPassword = "";
      sessionEmail = "";
      appRoot.style.display = "none";
      authGate.style.display = "";
      authPasswordInput.value = "";
      authError.textContent = "";
      showGoogleStep();
    }

    (function checkExistingAuth() {
      let authed = false;
      try {
        authed = localStorage.getItem(AUTH_STORAGE_KEY) === "1";
        if (authed) {
          sessionPassword = localStorage.getItem(AUTH_PASSWORD_KEY) || "";
          sessionEmail = localStorage.getItem(AUTH_EMAIL_KEY) || "";
        }
      } catch (err) { }
      if (authed) unlockApp();
    })();
  </script>
</body>
